<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Žrádlomapa</title>
    <meta
      name="description"
      content="Žrádlomapa je rychlý přehled podniků z veřejně dostupných dat. Hledejte podle názvu, města i typu a otevřete si detail na mapě."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="./favicon-192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./apple-touch-icon.png"
    />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#f5f1eb" />
    <meta
      name="zradlomapa-api"
      content="https://r.jina.ai/http://api.hejlik.cz/api/v1/restaurants"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Žrádlomapa" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <script>
      (() => {
        let theme = "light";
        try {
          theme = localStorage.getItem("zradlomapa:theme") || "light";
        } catch {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="Žrádlomapa – úvod"
          >žrádlomapa<span aria-hidden="true">.</span></a
        >
        <button
          id="themeToggleBtn"
          class="icon-btn"
          type="button"
          aria-label="Přepnout vzhled"
        >
          <span id="themeToggleIcon" aria-hidden="true">☀</span>
        </button>
      </header>
      <main>
        <section class="intro">
          <p class="eyebrow">DOBRÉ JÍDLO. BLÍZKO VÁS.</p>
          <h1>Kam na něco dobrého?</h1>
          <p>Najděte si podnik. Zbytek je na vaší chuti.</p>
        </section>
        <section class="search-panel" aria-label="Hledání podniků">
          <label class="search-label" for="query"
            >Město, podnik nebo chuť</label
          >
          <div class="search-row">
            <input
              id="query"
              type="search"
              value="Praha"
              placeholder="Třeba Brno, Eska nebo káva"
              autocomplete="off"
              enterkeyhint="search"
            /><button
              id="clearBtn"
              type="button"
              aria-label="Vymazat hledání a filtry"
            >
              Vymazat
            </button>
          </div>
          <div class="quick-filter-row" aria-label="Rychlé filtry měst">
            <button class="quick-filter-chip" type="button" data-query="Praha">
              Praha</button
            ><button class="quick-filter-chip" type="button" data-query="Brno">
              Brno</button
            ><button class="quick-filter-chip" type="button" data-query="Plzeň">
              Plzeň</button
            ><button
              class="quick-filter-chip"
              type="button"
              data-query="Liberec"
            >
              Liberec
            </button>
          </div>
          <div class="filter-row">
            <label class="sr-only" for="tagFilter">Typ podniku</label
            ><select id="tagFilter">
              <option value="">Všechny typy</option></select
            ><button id="openMapBtn" class="primary-btn" type="button">
              Zobrazit mapu ↗
            </button>
          </div>
        </section>
        <section class="results-column" aria-labelledby="resultsTitle">
          <div class="results-head">
            <h2 id="resultsTitle">Podniky</h2>
            <span id="resultMeta" role="status">Načítám…</span>
          </div>
          <div id="loadStatus" role="status">
            <span id="syncTime">Hledám podniky…</span
            ><span id="recordCount" hidden></span
            ><button id="retryBtn" type="button" hidden>Zkusit znovu</button>
          </div>
          <div id="results" class="results-grid" aria-busy="true"></div>
          <button id="loadMoreBtn" class="load-more" type="button" hidden>
            Zobrazit další podniky
          </button>
        </section>
      </main>
      <footer>
        Neoficiální průvodce · Zdroj:
        <a href="https://www.gastromapa.cz/" target="_blank" rel="noreferrer"
          >Gastromapa</a
        >
      </footer>
    </div>

    <div id="detailOverlay" class="detail-overlay" hidden>
      <button
        id="detailBackdrop"
        class="detail-backdrop"
        type="button"
        aria-label="Zavřít detail"
      ></button>
      <aside
        class="detail-drawer"
        role="dialog"
        aria-modal="true"
        aria-labelledby="detailDrawerTitle"
      >
        <div class="detail-drawer-head">
          <div>
            <p class="eyebrow">Detail místa</p>
            <h2 id="detailDrawerTitle">Podnik</h2>
          </div>
          <button
            id="detailCloseBtn"
            class="detail-close-btn"
            type="button"
            aria-label="Zavřít detail"
          >
            ×
          </button>
        </div>
        <div id="detail" class="detail-empty">
          Vyberte si podnik ze seznamu a tady se otevře jeho detail.
        </div>
      </aside>
    </div>

    <div id="mapOverlay" class="map-overlay" hidden>
      <div
        class="map-shell"
        role="dialog"
        aria-modal="true"
        aria-labelledby="mapTitle"
      >
        <div class="map-head">
          <div>
            <h2 id="mapTitle">Podniky na mapě</h2>
            <p id="mapMeta" class="panel-subtle">Načítám mapu…</p>
          </div>
          <div class="map-head-actions">
            <button id="locateUserBtn" class="ghost-btn" type="button">
              Moje poloha
            </button>
            <button
              id="closeMapBtn"
              class="detail-close-btn"
              type="button"
              aria-label="Zavřít mapu"
            >
              ×
            </button>
          </div>
        </div>
        <div class="map-filters">
          <input
            aria-label="Hledání na mapě"
            id="mapQuery"
            type="search"
            placeholder="Filtrovat podle názvu, města nebo typu…"
            autocomplete="off"
          />
          <select aria-label="Typ podniku na mapě" id="mapTagFilter">
            <option value="">Všechny typy</option>
          </select>
        </div>
        <div id="mapCanvas" class="map-canvas" aria-label="Mapa podniků"></div>
      </div>
    </div>

    <template id="resultTemplate">
      <article class="result-card">
        <button class="result-hit" type="button">
          <div class="result-top">
            <h3></h3>
            <span class="score-badge"></span>
          </div>
          <p class="result-address"></p>
          <div class="tag-row"></div>
        </button>
      </article>
    </template>

    <template id="galleryThumbTemplate">
      <button class="gallery-thumb" type="button">
        <img alt="" loading="lazy" />
      </button>
    </template>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
